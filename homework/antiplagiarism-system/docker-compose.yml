services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: antiplagiarism  # БД создается автоматически!
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - antiplagiarism-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d antiplagiarism" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - antiplagiarism-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 8080
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      file-storing-service:
        condition: service_started
      analysis-service:
        condition: service_started
    networks:
      - antiplagiarism-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # В сервисе file-storing-service добавить environment
  file-storing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: file-storing-service
        SERVICE_PORT: 8081
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: antiplagiarism
      DB_USER: admin
      DB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANALYSIS_SERVICE_URL: http://analysis-service:8082  # ДОБАВИТЬ
    volumes:
      - file_storage:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antiplagiarism-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  analysis-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: analysis-service
        SERVICE_PORT: 8082
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: antiplagiarism
      DB_USER: admin
      DB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILE_SERVICE_URL: http://file-storing-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      file-storing-service:
        condition: service_started
    networks:
      - antiplagiarism-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  antiplagiarism-network:
    driver: bridge

volumes:
  postgres_data:
  file_storage: